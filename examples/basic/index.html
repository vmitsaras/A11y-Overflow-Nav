<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A11y Overflow Nav — Basic example</title>
  <style>
    body { margin: 0; padding: 2rem; font-family: system-ui, sans-serif; }
    nav { max-inline-size: 44rem; }
    [data-overflow-nav-list] {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    [data-overflow-nav-item] a,
    [data-overflow-nav-menu] > button {
      display: block;
      padding: 0.65rem 0.85rem;
      white-space: nowrap;
    }
    [data-overflow-nav-menu] { position: relative; }
    [data-overflow-nav-menu] > div {
      position: absolute;
      z-index: 10;
      inset-block-start: calc(100% + 0.25rem);
      inset-inline-end: 0;
      min-inline-size: 12rem;
      padding: 0.5rem;
      border: 1px solid;
      background: Canvas;
      color: CanvasText;
    }
    [data-overflow-nav-overflow-list] {
      display: grid;
      gap: 0.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "a11y-menu-button/core": "../../node_modules/a11y-menu-button/dist/core.js"
      }
    }
  </script>
</head>
<body>
  <nav data-a11y-overflow-nav aria-label="Primary">
    <ul data-overflow-nav-list>
      <li data-overflow-nav-item><a href="#articles">Articles</a></li>
      <li data-overflow-nav-item><a href="#books">Books</a></li>
      <li data-overflow-nav-item><a href="#events">Events</a></li>
      <li data-overflow-nav-item><a href="#membership">Membership</a></li>
      <li data-overflow-nav-item><a href="#newsletter">Newsletter</a></li>

      <li data-overflow-nav-control hidden>
        <div data-overflow-nav-menu>
          <button type="button" aria-controls="basic-overflow-panel">More</button>
          <div id="basic-overflow-panel" hidden>
            <ul data-overflow-nav-overflow-list></ul>
          </div>
        </div>
      </li>
    </ul>
  </nav>

  <script type="module">
    import { createOverflowNav } from '../../dist/index.js';

    const root = document.querySelector('[data-a11y-overflow-nav]');
    if (root instanceof HTMLElement) {
      createOverflowNav(root);
    }
  </script>
</body>
</html>
