      - heading "A11y Overflow Nav" [level=1] [ref=e5]
      - paragraph [ref=e6]: Resize the component rather than the browser. Switch layout mode, direction, label length, and text scale while inspecting the exact visible/overflow distribution and lifecycle events.
      - paragraph [ref=e7]:
        - link "View GitHub repository" [ref=e8] [cursor=pointer]:
          - /url: https://github.com/vmitsaras/A11y-Overflow-Nav
    - region [ref=e9]:
      - heading "Initialization and lifecycle" [level=2] [ref=e10]
      - paragraph [ref=e11]: Author every destination in the primary list and keep the final More control hidden. Register lifecycle listeners before initialization so the synchronous initial events are captured.
      - generic [ref=e12]:
        - generic [ref=e13]:
          - heading "Semantic structure" [level=3] [ref=e14]
          - code [ref=e16]: <nav data-a11y-overflow-nav aria-label="Primary"> <ul data-overflow-nav-list> <li data-overflow-nav-item><a href="/articles">Articles</a></li> <li data-overflow-nav-control hidden> <div data-overflow-nav-menu> <button aria-controls="overflow-panel">More</button> <div id="overflow-panel" hidden> <ul data-overflow-nav-overflow-list></ul> </div> </div> </li> </ul> </nav>
        - generic [ref=e17]:
          - heading "Initialize and observe" [level=3] [ref=e18]
          - code [ref=e20]: "import { createOverflowNav, OVERFLOW_NAV_EVENTS, } from 'a11y-overflow-nav'; const root = document.querySelector('[data-a11y-overflow-nav]'); if (root instanceof HTMLElement) { for (const name of Object.values(OVERFLOW_NAV_EVENTS)) { root.addEventListener(name, (event) => { console.log(event.type, event.detail.reason, event.detail.overflowCount); }); } const instance = createOverflowNav(root, { observeResize: true, fitTolerance: 1, menuButtonOptions: {}, }); instance.refresh(); // After application-driven content changes. // instance.destroy(); // During application teardown. }"
      - paragraph [ref=e21]:
        - text: An initial redistribution can emit
        - code [ref=e22]: overflow-nav:change
        - text: before
        - code [ref=e23]: overflow-nav:init
        - text: . A refresh can likewise emit a change before its refresh event. Destroy emits its snapshot before the authored DOM and state are restored.
